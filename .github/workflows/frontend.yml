name: Deploy Frontend (Azure)

on:
  push:
    branches: [main]
    paths:
      - "loadforge/**"
      - ".github/workflows/frontend.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/docker-login@v1
        with:
          login-server: egovregistry.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push frontend image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_APP_URL=${{ secrets.NEXT_PUBLIC_APP_URL }} \
            --build-arg NEXT_PUBLIC_BETTER_AUTH_CALLBACK=${{ secrets.NEXT_PUBLIC_BETTER_AUTH_CALLBACK }} \
            -t egovregistry.azurecr.io/loadforge-frontend:${{ github.sha }} \
            -t egovregistry.azurecr.io/loadforge-frontend:latest \
            ./loadforge
          docker push -a egovregistry.azurecr.io/loadforge-frontend

      - uses: azure/webapps-deploy@v3
        with:
          app-name: LoadForge-Frontend-Prod
          publish-profile: ${{ secrets.AZURE_FRONTEND_PUBLISH_PROFILE }}
          images: egovregistry.azurecr.io/loadforge-frontend:${{ github.sha }}
